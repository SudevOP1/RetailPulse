[project]
name = "retailpulse"
version = "0.1.0"
description = "E-commerce analytics on the Olist dataset: Postgres + dbt + Python + Power BI"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "dbt/retailpulse/target", "dbt/retailpulse/dbt_packages", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["db: test needs a reachable PostgreSQL with the raw schema loaded"]
